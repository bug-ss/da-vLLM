[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "da-vllm"
version = "0.1.0"
description = "Declarative Attention (DA): model-declared sparse attention for vLLM"
requires-python = ">=3.11"
# torch is imported at package import time (the mask, the remap, the vLLM
# hook), and jinja2 by da_vllm.testing, which the offline dry run and the test
# suite both use. Neither is optional in practice, so neither belongs in an
# extra -- `pip install da-vllm` has to give you a package that imports.
dependencies = [
  "torch>=2.4",
  "jinja2>=3",
]

[project.optional-dependencies]
# The versions the paper's results were produced with. Pinned exactly.
# causal-conv1d needs --no-build-isolation and deep-gemm comes from a git tag,
# so both live in requirements-serve.txt rather than here. See
# docs/ENVIRONMENT.md.
serve = [
  "torch==2.11.0",
  "vllm==0.20.2",
  "transformers==5.5.4",
  "triton==3.6.0",
  "flashinfer-python==0.6.8.post1",
  "flash-linear-attention==0.5.0",
  "datasets==3.6.0",
]
# `jinja2` is a runtime dependency of da_vllm.testing, the offline tokenizer.
dev = ["pytest>=8", "pyflakes>=3"]
#: The HTTP client for a vLLM server on another machine.
remote = ["requests>=2.28"]

[project.scripts]
da = "da_vllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
da_vllm = ["resources/*.py", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
